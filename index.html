<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LithoPrint Studio v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=Roboto+Mono:wght@400;700&display=swap');
        
        :root {
            --bg-primary: #050505;
            --panel-bg: rgba(15, 15, 15, 0.98);
            --accent: #ff0000;
        }

        body { 
            font-family: 'Roboto Mono', monospace; 
            background-color: var(--bg-primary); 
            color: #d1d1d1; 
            overflow: hidden; 
            margin: 0;
        }
        
        /* Preview Backgrounds */
        .checkerboard {
            background-image: linear-gradient(45deg, #111 25%, transparent 25%), 
                              linear-gradient(-45deg, #111 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #111 75%), 
                              linear-gradient(-45deg, transparent 75%, #111 75%);
            background-size: 20px 20px; background-color: #080808;
        }
        .white-shirt { background-color: #ffffff !important; background-image: none !important; }
        .black-shirt { background-color: #0d0d0d !important; background-image: none !important; }
        .green-screen { background-color: #00ff00 !important; background-image: none !important; }
        
        /* UI Elements */
        input[type=range] { 
            accent-color: var(--accent); 
            height: 4px; 
            background: #222; 
            border-radius: 5px; 
            appearance: none; 
            width: 100%;
        }
        
        input[type=range]::-webkit-slider-thumb { 
            appearance: none; 
            width: 14px; 
            height: 14px; 
            background: #fff; 
            border-radius: 50%; 
            cursor: pointer; 
            border: 2px solid var(--accent); 
        }

        .control-panel { 
            background: var(--panel-bg); 
            border: 1px solid #222; 
        }

        .btn-primary { 
            background: #fff; 
            color: #000; 
            transition: all 0.15s ease; 
            font-family: 'Inter', sans-serif; 
            font-weight: 900; 
        }

        .btn-primary:hover:not(:disabled) { 
            background: var(--accent); 
            color: #fff; 
        }
        
        #canvasWrapper { 
            cursor: grab; 
            transition: transform 0.05s linear; 
            display: inline-block; 
        }
        
        #canvasWrapper:active { cursor: grabbing; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    </style>
</head>
<body class="h-screen p-4 flex flex-col items-center justify-center">
    <div class="max-w-7xl w-full grid grid-cols-1 lg:grid-cols-12 gap-6 h-[94vh]">
        
        <!-- Controls Side -->
        <aside class="lg:col-span-4 flex flex-col gap-4 overflow-y-auto pr-2">
            <header class="mb-2">
                <h1 class="text-2xl font-black italic tracking-tighter text-white uppercase">LithoPrint Studio</h1>
                <p class="text-[9px] text-zinc-500 uppercase tracking-[0.3em]">Precision Production // Litho v2.0</p>
            </header>

            <div class="control-panel p-6 rounded-lg space-y-6">
                <!-- Upload -->
                <div>
                    <input type="file" id="imageInput" accept="image/*" class="hidden">
                    <button onclick="document.getElementById('imageInput').click()" 
                        class="w-full py-3 border-2 border-dashed border-zinc-800 rounded hover:border-red-600 hover:bg-zinc-900 transition-all text-[10px] uppercase font-bold tracking-widest text-zinc-400">
                        Import Source File
                    </button>
                </div>

                <!-- Transparency Settings -->
                <div class="space-y-5 pt-2 border-t border-zinc-900">
                    <div class="space-y-2">
                        <div class="flex justify-between items-baseline">
                            <label class="text-[10px] uppercase font-bold text-zinc-400">1. White Cutoff</label>
                            <span id="tolValue" class="text-xs font-bold text-red-500">240</span>
                        </div>
                        <input type="range" id="tolerance" min="100" max="255" value="240">
                    </div>

                    <div class="space-y-2">
                        <div class="flex justify-between items-baseline">
                            <label class="text-[10px] uppercase font-bold text-white">2. Black Crush (Density)</label>
                            <span id="crushValue" class="text-xs font-bold text-red-500">80</span>
                        </div>
                        <input type="range" id="blackCrush" min="0" max="200" value="80">
                        <p class="text-[8px] text-zinc-600 uppercase">Forces semi-transparent pixels to solid ink.</p>
                    </div>
                </div>

                <!-- Ink Color Override -->
                <div class="space-y-4 pt-4 border-t border-zinc-900 bg-zinc-900/40 p-4 rounded border border-zinc-800">
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-[10px] uppercase font-bold text-zinc-400 tracking-widest">3. Output Ink Color</label>
                        <input type="color" id="inkColor" value="#000000" class="w-8 h-8 bg-transparent border-0 cursor-pointer">
                    </div>
                    <p class="text-[8px] text-zinc-500 uppercase italic">Use #000000 for standard black print.</p>
                </div>

                <!-- Actions -->
                <button id="processBtn" disabled class="w-full py-4 rounded btn-primary uppercase text-sm tracking-widest disabled:opacity-10">
                    Apply Print Optimization
                </button>

                <!-- View Modes -->
                <div class="pt-4 border-t border-zinc-900 grid grid-cols-2 gap-2">
                    <button onclick="setView('white')" class="bg-white text-black py-2 text-[8px] font-bold uppercase rounded border border-white">White Shirt</button>
                    <button onclick="setView('black')" class="bg-black text-white py-2 text-[8px] font-bold uppercase rounded border border-zinc-700">Black Shirt</button>
                    <button onclick="setView('checker')" class="bg-zinc-800 py-2 text-[8px] font-bold uppercase rounded hover:bg-zinc-700">Checker</button>
                    <button onclick="setView('green')" class="bg-green-900 py-2 text-[8px] font-bold uppercase rounded hover:bg-green-800">Green Check</button>
                </div>

                <!-- Zoom Control -->
                <div class="flex items-center justify-between gap-4 bg-black/40 p-3 rounded">
                    <label class="text-[9px] uppercase font-bold text-zinc-500">Zoom</label>
                    <input type="range" id="zoomScale" min="0.05" max="4" step="0.01" value="1">
                    <span id="zoomVal" class="text-[9px] font-bold w-10 text-right">1.0x</span>
                </div>
            </div>
        </aside>

        <!-- Preview Side -->
        <main class="lg:col-span-8 flex flex-col h-full overflow-hidden">
            <div id="canvasContainer" class="flex-grow white-shirt relative rounded-lg border border-zinc-900 overflow-hidden flex items-center justify-center">
                <div id="canvasWrapper">
                    <canvas id="mainCanvas" class="shadow-2xl opacity-0 transition-opacity duration-300"></canvas>
                </div>
                <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center text-zinc-800 uppercase italic pointer-events-none">
                    <p class="text-sm font-black tracking-[1em]">Studio Idle</p>
                </div>
            </div>

            <button id="downloadBtn" disabled class="mt-4 w-full border-2 border-zinc-900 py-4 uppercase text-[10px] font-black tracking-[0.5em] text-zinc-700 hover:text-white hover:border-red-600 transition-all disabled:opacity-0">
                Download Production PNG
            </button>
        </main>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const tolInput = document.getElementById('tolerance');
        const crushInput = document.getElementById('blackCrush');
        const inkColorInput = document.getElementById('inkColor');
        const tolVal = document.getElementById('tolValue');
        const crushVal = document.getElementById('crushValue');
        const zoomScale = document.getElementById('zoomScale');
        const zoomVal = document.getElementById('zoomVal');
        const canvasWrapper = document.getElementById('canvasWrapper');
        const processBtn = document.getElementById('processBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const mainCanvas = document.getElementById('mainCanvas');
        const ctx = mainCanvas.getContext('2d', { willReadFrequently: true });
        const canvasContainer = document.getElementById('canvasContainer');

        let originalImage = null;
        let scale = 1, translateX = 0, translateY = 0, isDragging = false, startX, startY;

        const updateDisplay = () => {
            tolVal.textContent = tolInput.value;
            crushVal.textContent = crushInput.value;
        };
        [tolInput, crushInput].forEach(i => i.addEventListener('input', updateDisplay));

        const setView = (mode) => {
            canvasContainer.classList.remove('checkerboard', 'green-screen', 'black-shirt', 'white-shirt');
            canvasContainer.classList.add(`${mode}-shirt`);
            if(mode === 'checker') {
                canvasContainer.classList.remove('checker-shirt');
                canvasContainer.classList.add('checkerboard');
            }
            if(mode === 'green') {
                canvasContainer.classList.remove('green-shirt');
                canvasContainer.classList.add('green-screen');
            }
        };

        const updateTransform = () => {
            canvasWrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        };

        const handleZoom = () => {
            scale = parseFloat(zoomScale.value);
            zoomVal.textContent = scale.toFixed(2) + 'x';
            updateTransform();
        };
        zoomScale.addEventListener('input', handleZoom);

        // Interaction
        canvasContainer.addEventListener('mousedown', (e) => { 
            if (!originalImage) return; 
            isDragging = true; 
            startX = e.clientX - translateX; 
            startY = e.clientY - translateY; 
        });
        window.addEventListener('mousemove', (e) => { 
            if (!isDragging) return; 
            translateX = e.clientX - startX; 
            translateY = e.clientY - startY; 
            updateTransform(); 
        });
        window.addEventListener('mouseup', () => isDragging = false);
        canvasContainer.addEventListener('wheel', (e) => { 
            e.preventDefault(); 
            let delta = e.deltaY > 0 ? -0.05 : 0.05;
            let newScale = Math.min(Math.max(parseFloat(zoomScale.value) + delta, 0.05), 4);
            zoomScale.value = newScale;
            handleZoom(); 
        }, { passive: false });

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    mainCanvas.width = img.width; mainCanvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    mainCanvas.classList.remove('opacity-0');
                    document.getElementById('emptyState').style.display = 'none';
                    processBtn.disabled = false;
                    // Auto-fit logic
                    const sFit = Math.min((canvasContainer.offsetWidth-40)/img.width, (canvasContainer.offsetHeight-40)/img.height, 1);
                    zoomScale.value = sFit;
                    translateX = 0; translateY = 0;
                    handleZoom();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        const hexToRgb = (hex) => {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return { r, g, b };
        };

        processBtn.addEventListener('click', () => {
            if (!originalImage) return;
            ctx.drawImage(originalImage, 0, 0);
            let imageData = ctx.getImageData(0, 0, mainCanvas.width, mainCanvas.height);
            let data = imageData.data;
            
            const cutoff = parseInt(tolInput.value);
            const crush = parseInt(crushInput.value);
            const ink = hexToRgb(inkColorInput.value);

            for (let i = 0; i < data.length; i += 4) {
                const brightness = (0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2]);
                
                // Color Override
                data[i] = ink.r;
                data[i+1] = ink.g;
                data[i+2] = ink.b;

                if (brightness >= cutoff) {
                    data[i + 3] = 0;
                } else {
                    let alpha = 255;
                    if (brightness > crush) {
                        const range = cutoff - crush;
                        const factor = (cutoff - brightness) / range;
                        alpha = factor * 255;
                    }
                    data[i + 3] = Math.min(255, alpha);
                }
            }

            ctx.putImageData(imageData, 0, 0);
            downloadBtn.disabled = false;
        });

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `lithoprint_master_${Date.now()}.png`;
            link.href = mainCanvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
